# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration

[changelog]
# Body template: group_by(group) for sections, group_by(message) for dedup.
# Uses pr_title when available; replace_regex links #N (preprocessors only run on message).
# Note: for explicit RC ranges (prev-rc..tag), previous.version is still the last stable tag
# (tag_pattern). release.yml replaces the first line in CI; fix locally when previewing RCs.
body = """
## What's Changed

{%- if version %} in {{ version | trim_start_matches(pat="v") }}{%- else %} (since {{ previous.version | default(value="initial") }}){%- endif -%}
{%- for group, group_commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for msg, dupes in group_commits | group_by(attribute="message") -%}
  {%- set commit = dupes | first -%}
  {%- if commit.remote.pr_title -%}
    {%- set commit_message = commit.remote.pr_title -%}
  {%- else -%}
    {%- set commit_message = commit.message -%}
  {%- endif %}
  * {{ commit_message | split(pat="\n") | first | trim | replace_regex(from="(^|[^\\[])#([0-9]+)", to=["$1[#$2](", self::remote_url(), "/issues/$2)"] | join(sep="")) }}\
    {%- if commit.remote.username %} by @{{ commit.remote.username }}{% endif -%}
    {%- if commit.remote.pr_number %} in [#{{ commit.remote.pr_number }}]({{ self::remote_url() }}/pull/{{ commit.remote.pr_number }}){% endif %}
{%- endfor -%}
{% raw %}
{% endraw -%}
{%- endfor -%}

{% if version %}
    {% if previous.version %}
      **Full Changelog**: {{ self::remote_url() }}/compare/{{ previous.version }}...{{ version }}
    {% endif %}
{% else -%}
  {% raw %}\n{% endraw %}
{% endif %}

{%- macro remote_url() -%}
  https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}
{%- endmacro -%}
"""
# Remove leading and trailing whitespaces from the changelog's body.
trim = true

[git]
# Explicit parsers assign groups. conventional_commits default groups lack the order prefix.
conventional_commits = false
# Include unconventional commits; do not exclude them.
filter_unconventional = false
# Treat each commit as one; do not split on newlines.
split_commits = false
# Group commits by type. Prefix "<!-- N -->" controls section order (stripped in template).
# Parsers follow that section order. First match wins. Two rules stay out of sequence,
# each immediately above the pattern they must beat:
# - chore(deps) sits above ^(chore|ci|cosmetic|style). That pattern matches the "chore"
#   prefix of "chore(deps):", so a later rule would file those commits as Chore.
# - Dependabot merges sit above the generic "^Merge pull request" skip, or those merges
#   are dropped. Squash-merged Dependabot commits are only a "Bump ..." subject, so those
#   are Dependencies too. Identical bump subjects still collapse under message dedup.
# ".*" matches everything, so it stays last.
commit_parsers = [
  { message = "(?i)^(feat|add)", group = "<!-- 00 -->Features" },
  { message = "(?i)^fix", group = "<!-- 01 -->Bug Fixes" },
  { message = "(?i)^docs?", group = "<!-- 02 -->Documentation" },
  { message = "(?i)^refactor", group = "<!-- 03 -->Refactor" },
  { message = "(?i)^chore\\(deps\\)", group = "<!-- 05 -->Dependencies" },
  { message = "(?i)^(chore|ci|cosmetic|style)", group = "<!-- 04 -->Chore" },
  { message = "(?i)^deps", group = "<!-- 05 -->Dependencies" },
  { message = "^Bump", group = "<!-- 05 -->Dependencies" },
  { message = "^Merge pull request.*dependabot", group = "<!-- 05 -->Dependencies" },
  { message = "^Merge pull request", skip = true },
  { message = ".*", group = "<!-- 06 -->Other" },
]
# Rewrite commit messages before display: (#123) → link; bare #123 → link (avoids matching inside [...])
# Note: replace strings are not Tera-evaluated; URLs here stay hardcoded. Template uses remote_url().
commit_preprocessors = [
  { pattern = '\\(#([0-9]+)\\)', replace = "([#$1](https://github.com/NefMoto/NefMotoOpenSource/issues/$1))" },
  { pattern = "(^|[^\\[])#([0-9]+)", replace = "$1[#$2](https://github.com/NefMoto/NefMotoOpenSource/issues/$2)" },
]
# Include commits that do not match any commit_parser (they go to "Other").
filter_commits = false
# Order of commits in each group/release within the changelog.
sort_commits = "newest"
# Match only stable tags (v1.9.6.0). RC tags (v1.9.6.0-rc3) are ignored.
#   -l: changelog for latest stable (since previous stable). For RC use explicit range.
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$"
